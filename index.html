    <link rel="icon" type="image/png" href="anime.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        black: '#050505',
                        zinc: { 800: '#1f1f22', 900: '#18181b' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #050505;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* Base Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #050505; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .glass {
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-card {
            background: linear-gradient(180deg, rgba(30,30,30,0.5) 0%, rgba(15,15,15,0.8) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px -10px rgba(255,255,255,0.1);
            transform: translateY(-8px);
        }

        .hidden-section {
            display: none !important;
        }

        .hero-bg {
            background: linear-gradient(to bottom, rgba(5,5,5,0.2) 0%, rgba(5,5,5,1) 100%), url('https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=2532&auto=format&fit=crop') center/cover no-repeat;
            position: relative;
        }
        
        .hero-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, #050505 100%);
            z-index: 0;
        }

        /* Horizontal Scrolling Utilities */
        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 1.5rem;
            padding-bottom: 1rem;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* Momentum scrolling on iOS */
        }

        .scroll-item {
            flex: 0 0 240px; /* Fixed width for smaller cards on desktop */
            width: 240px;
            scroll-snap-align: start;
        }

        /* Prevent single result from taking up the whole row */
        .single-result-container {
            display: flex;
            justify-content: flex-start;
        }

        @media (max-width: 640px) {
            .scroll-item { 
                flex: 0 0 180px; /* Even smaller cards for mobile */
                width: 180px;
            }
            .scroll-container {
                gap: 1rem; /* Tighter spacing on mobile */
            }
        }

    </style>
</head>

        /**
         * Dynamically creates a DOM element for a single anime card.
         * Adjusted dimensions and padding for the smaller horizontal format, preserving original visual styles.
         * 
         * @param {Object} anime - An object from the animeData array.
         * @returns {HTMLElement} The complete HTML element for the card.
         */
        function createAnimeCard(anime) {
            const card = document.createElement('div');
            // Added scroll-item class to lock width
            card.className = 'scroll-item glass-card rounded-xl overflow-hidden flex flex-col group relative h-full';

            const imgContainer = document.createElement('div');
            imgContainer.className = 'relative aspect-[2/3] overflow-hidden bg-zinc-900';
            
            const img = document.createElement('img');
            img.src = anime.coverImage || 'https://placehold.co/400x600/18181b/ffffff?text=No+Image';
            img.alt = anime.title;
            img.className = 'w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-all duration-500 group-hover:scale-105';
            
            img.onerror = () => {
                img.src = `https://placehold.co/400x600/18181b/ffffff?text=${encodeURIComponent(anime.title)}`;
            };

            const rankBadge = document.createElement('div');
            // Adjusted badge size slightly
            rankBadge.className = 'absolute top-3 right-3 bg-black/60 backdrop-blur-md border border-white/20 text-white text-[10px] md:text-xs font-bold px-2.5 py-1 rounded-full z-10 shadow-lg';
            rankBadge.textContent = anime.rank ? `Rank #${anime.rank}` : 'Unranked';

            imgContainer.appendChild(img);
            if(anime.rank) imgContainer.appendChild(rankBadge);

            const content = document.createElement('div');
            // Reduced padding slightly for smaller card
            content.className = 'p-4 flex flex-col flex-grow gap-3';

            const textDiv = document.createElement('div');
            textDiv.className = 'flex-grow flex flex-col gap-1';

            const title = document.createElement('h3');
            // Reduced text size slightly
            title.className = 'text-base md:text-lg font-bold text-white leading-tight line-clamp-2';
            title.textContent = anime.title; 
            
            const details = document.createElement('p');
            // Reduced text size and clamps for compact fit
            details.className = 'text-xs text-zinc-400 line-clamp-2 leading-relaxed';
            details.textContent = anime.details; 

            textDiv.appendChild(title);
            textDiv.appendChild(details);

            const downloadBtn = document.createElement('a');
            downloadBtn.href = '?id=' + anime.id;
            downloadBtn.className = 'mt-auto flex items-center justify-center gap-2 w-full bg-white text-black hover:bg-gray-200 font-semibold py-2.5 px-3 rounded-lg transition-colors text-sm';
            
            downloadBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span class="btn-text">Download</span>
            `;

            content.appendChild(textDiv);
            content.appendChild(downloadBtn);

            card.appendChild(imgContainer);
            card.appendChild(content);

            return card;
        }

        /**
         * 2. Landing Page — Categorized Horizontal Rankings
         */
        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            if (!container) return; 
            container.innerHTML = ''; 

            // Extract unique categories (ignoring items without categories)
            const categories = [...new Set(animeData.map(a => a.category))].filter(Boolean);

            categories.forEach(cat => {
                // Get items for this category and sort by rank
                const categoryAnime = animeData
                    .filter(a => a.category === cat && a.rank)
                    .sort((a, b) => a.rank - b.rank);
                
                if (categoryAnime.length === 0) return;

                const section = document.createElement('div');
                section.className = 'w-full';
                
                const header = document.createElement('h3');
                header.className = 'text-xl md:text-2xl font-bold tracking-tight mb-4 text-white uppercase border-l-4 border-zinc-500 pl-3';
                header.textContent = cat;
                
                const scrollWrapper = document.createElement('div');
                scrollWrapper.className = 'scroll-container w-full';
                
                categoryAnime.forEach(anime => {
                    scrollWrapper.appendChild(createAnimeCard(anime));
                });
                
                section.appendChild(header);
                section.appendChild(scrollWrapper);
                container.appendChild(section);
            });
        }

        /**
         * 4. Search Result UI
         */
        function renderSearchResults(results) {
            const container = document.getElementById('searchResults');
            const meta = document.getElementById('searchMeta');
            if (!container || !meta) return;

            container.innerHTML = ''; 
            meta.textContent = `Found ${results.length} result${results.length !== 1 ? 's' : ''}`;

            if (results.length === 0) {
                // Remove formatting classes so empty state looks right
                container.className = '';
                
                const emptyState = document.createElement('div');
                emptyState.className = 'w-full py-16 text-center glass rounded-xl border-dashed border border-white/20';
                
                const msgTitle = document.createElement('h3');
                msgTitle.className = 'text-2xl font-bold mb-2 text-white';
                msgTitle.textContent = 'No anime found.';
                
                const msgDesc = document.createElement('p');
                msgDesc.className = 'text-zinc-400';
                msgDesc.textContent = 'Try adjusting your search terms.';

                emptyState.appendChild(msgTitle);
                emptyState.appendChild(msgDesc);
                container.appendChild(emptyState);
                return;
            }

            // Apply horizontal scroll container class for 1 or more results.
            // If there's 1 result, flex layout will naturally keep it compact on the left.
            container.className = 'scroll-container w-full';
            
            results.forEach(anime => {
                container.appendChild(createAnimeCard(anime));
            });
        }

        /**
         * 3. Search System
         */
        function searchAnime(event) {
            const searchQuery = event.target.value.trim().toLowerCase();
            
            const heroSection = document.getElementById('heroSection');
            const landingSection = document.getElementById('landingSection');
            const searchSection = document.getElementById('searchSection');
            const downloadPageSection = document.getElementById('downloadPageSection');

            if (downloadPageSection) {
                downloadPageSection.classList.add('hidden-section');
            }

            if (searchQuery === '') {
                if (window.location.search) window.history.pushState({}, '', window.location.pathname);
                heroSection.classList.remove('hidden-section');
                landingSection.classList.remove('hidden-section');
                searchSection.classList.add('hidden-section');
                return;
            }

            heroSection.classList.add('hidden-section');
            landingSection.classList.add('hidden-section');
            searchSection.classList.remove('hidden-section');

            const searchResultsList = animeData.filter(anime => 
                anime.title.toLowerCase().includes(searchQuery)
            );

            renderSearchResults(searchResultsList);
        }
        
        /**
         * Reset view helper
         */
        function resetToHome() {
            if (window.location.search) window.history.pushState({}, '', window.location.pathname);
            
            const searchInput = document.getElementById('animeSearch');
            if (searchInput) {
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input'));
            }

            document.getElementById('downloadPageSection').classList.add('hidden-section');
            document.getElementById('heroSection').classList.remove('hidden-section');
            document.getElementById('landingSection').classList.remove('hidden-section');
        }

        /**
         * 6. Render Download Page
         */
        function renderDownloadPage(animeId) {
            const container = document.getElementById('downloadContent');
            if (!container) return;

            const anime = animeData.find(item => item.id === animeId);

            if (!anime) {
                container.innerHTML = `
                    <div class="text-center py-20 glass rounded-2xl border border-white/10">
                        <h2 class="text-3xl font-bold text-white mb-4">Anime not found.</h2>
                        <button onclick="resetToHome()" class="text-zinc-400 hover:text-white underline transition-colors">Go back to home</button>
                    </div>
                `;
                return;
            }

            let html = `
                <button onclick="resetToHome()" class="mb-8 flex items-center gap-2 text-zinc-400 hover:text-white transition-colors group">
                    <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Browse
                </button>
                
                <div class="flex flex-col md:flex-row gap-8 lg:gap-12 mb-12 glass p-6 md:p-8 rounded-2xl border border-white/10 shadow-2xl">
                    <div class="w-full md:w-1/3 lg:w-1/4 flex-shrink-0 relative">
                        <img src="${anime.coverImage}" alt="${anime.title}" onerror="this.src='https://placehold.co/600x900/18181b/ffffff?text=${encodeURIComponent(anime.title)}'" class="w-full rounded-xl shadow-2xl border border-white/10 aspect-[2/3] object-cover">
                        <div class="absolute top-4 right-4 bg-black/60 backdrop-blur-md border border-white/20 text-white text-xs font-bold px-3 py-1.5 rounded-full z-10 shadow-lg">Rank #${anime.rank}</div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tighter mb-6 text-white leading-tight">${anime.title}</h1>
                        <p class="text-lg text-zinc-300 leading-relaxed font-light">${anime.details}</p>
                    </div>
                </div>
            `;

            if (anime.seasons && anime.seasons.length > 0) {
                anime.seasons.forEach((season, index) => {
                    const seasonId = `season-${index}`;
                    html += `
                        <div class="mb-6 glass rounded-2xl border border-white/10 overflow-hidden">
                            <button onclick="toggleSeason('${seasonId}', this)" class="w-full flex items-center justify-between p-6 bg-white/5 hover:bg-white/10 transition-colors text-left focus:outline-none group">
                                <h2 class="text-2xl font-bold text-white tracking-tight">Season ${season.season}</h2>
                                <svg class="w-6 h-6 text-zinc-400 group-hover:text-white transition-transform duration-300 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div id="${seasonId}" class="hidden flex-col gap-2 p-6 pt-2 bg-black/20 border-t border-white/5">
                    `;
                    
                    if (season.episodes && season.episodes.length > 0) {
                        season.episodes.forEach(ep => {
                            html += `
                                <div class="flex items-center justify-between p-4 glass rounded-xl hover:bg-white/5 transition-colors border border-transparent hover:border-white/10 group">
                                    <div class="flex items-center gap-4 md:gap-6">
                                        <span class="text-zinc-500 font-bold tracking-wider text-sm w-12 md:w-16">EP ${ep.episode}</span>
                                        <span class="text-zinc-200 font-medium md:text-lg group-hover:text-white transition-colors">${ep.title}</span>
                                    </div>
                                    <a href="${ep.downloadLink}" target="_blank" class="px-5 py-2.5 rounded-lg bg-white/10 hover:bg-white text-white hover:text-black font-semibold text-sm transition-all flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        <span class="hidden sm:inline">Download</span>
                                    </a>
                                </div>
                            `;
                        });
                    } else {
                        html += `<p class="text-zinc-500 italic px-4">No episodes available for this season.</p>`;
                    }
                    
                    html += `
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `
                    <div class="text-center py-16 glass rounded-2xl border border-white/10">
                        <p class="text-zinc-400 mb-6 text-lg">Detailed season information is not available yet.</p>
                        <a href="${anime.downloadLink}" target="_blank" class="inline-flex items-center gap-2 px-8 py-4 rounded-lg bg-white text-black font-bold tracking-wide hover:bg-gray-200 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download Full Anime
                        </a>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function toggleSeason(seasonId, btn) {
            const content = document.getElementById(seasonId);
            const icon = btn.querySelector('svg');
            
            if (content) {
                content.classList.toggle('hidden');
                content.classList.toggle('flex');
                icon.classList.toggle('rotate-180');
            }
        }

        /**
         * 5. Initial State
         */
        function initSystem() {
            const params = new URLSearchParams(window.location.search);
            const animeId = params.get('id');

            if (animeId) {
                document.getElementById('heroSection').classList.add('hidden-section');
                document.getElementById('landingSection').classList.add('hidden-section');
                document.getElementById('searchSection').classList.add('hidden-section');
                document.getElementById('downloadPageSection').classList.remove('hidden-section');
                
                renderDownloadPage(Number(animeId));
            } else {
                // Initialize horizontally scrolling categories
                renderCategories();
            }

            const searchInput = document.getElementById('animeSearch');
            if (searchInput) {
                searchInput.addEventListener('input', searchAnime);
            }

            const clearBtn = document.getElementById('clearSearchBtn');
            if (clearBtn && searchInput) {
                clearBtn.addEventListener('click', () => {
                    searchInput.value = '';
                    searchInput.dispatchEvent(new Event('input'));
                });
            }
        }

        document.addEventListener('DOMContentLoaded', initSystem);

    </script>
</body>
</html>
